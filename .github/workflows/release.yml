name: Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: dartser-linux
          - os: windows-latest
            platform: windows
            output: dartser-windows.exe
          - os: macos-14
            platform: macos
            output: dartser-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build executable
        run: dart compile exe -o ${{ matrix.output }} bin/main.dart
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dartser-${{ matrix.platform }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dartser-linux/dartser-linux
            artifacts/dartser-windows/dartser-windows.exe
            artifacts/dartser-macos/dartser-macos
